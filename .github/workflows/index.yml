name: Pull and Verify Docker Image

# Trigger manually from the Actions tab, or on every push to main
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

env:
  # Change these to match your Docker Hub repo
  DOCKERHUB_IMAGE: your-dockerhub-username/your-image-name
  IMAGE_TAG: latest

jobs:
  pull-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull image from Docker Hub
        run: docker pull ${{ env.DOCKERHUB_IMAGE }}:${{ env.IMAGE_TAG }}

      - name: Verify image was pulled
        run: |
          echo "Checking image details..."
          docker image inspect ${{ env.DOCKERHUB_IMAGE }}:${{ env.IMAGE_TAG }}

      - name: List pulled images (sanity check)
        run: docker images | grep "$(echo ${{ env.DOCKERHUB_IMAGE }} | cut -d'/' -f2)"

      - name: Quick smoke test (optional)
        run: |
          # Runs the container briefly and exits.
          # Remove or adjust this step if your image isn't meant to run standalone.
          docker run --rm ${{ env.DOCKERHUB_IMAGE }}:${{ env.IMAGE_TAG }} echo "Image runs successfully"
